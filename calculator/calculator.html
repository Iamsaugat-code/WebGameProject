<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="first_box">
      <div class="input_box">
        <input type="text" id="display" />
      </div>
      <div class="row_1">
        <div class="box_1" value="1">
          <h2>1</h2>
        </div>
        <div class="box_1" value="2">
          <h2>2</h2>
        </div>
        <div class="box_1" value="3">
          <h2>3</h2>
        </div>
        <div class="box_1" value="4">
          <h2>4</h2>
        </div>
      </div>
      <div class="row_2">
        <div class="box_1" value="5">
          <h2>5</h2>
        </div>
        <div class="box_1" value="6">
          <h2>6</h2>
        </div>
        <div class="box_1" value="7">
          <h2>7</h2>
        </div>
        <div class="box_1" value="8">
          <h2>8</h2>
        </div>
      </div>
      <div class="row_3">
        <div class="box_1" value="9">
          <h2>9</h2>
        </div>
        <div class="box_1" value="0">
          <h2>0</h2>
        </div>

        <button class="box_1" value=".">
          <h2>.</h2>
        </button>
        <button class="box_1" value="+">
          <h2>+</h2>
        </button>
      </div>

      <div class="row_4">
        <button class="box_1" value="-">
          <h2>-</h2>
        </button>
        <button class="box_1" value="*">
          <h2>*</h2>
        </button>
        <button class="box_1" value="%">
          <h2>%</h2>
        </button>
        <button class="box_1" value="/">
          <h2>/</h2>
        </button>
      </div>
      <div class="row_5">
        <button class="box_2" id="equalto">
          <h2>=</h2>
        </button>
        <button class="box_2" id="cancel">
          <h2>C</h2>
        </button>
        <button class="box_2" id="back">
          <h2>del</h2>
        </button>
      </div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
